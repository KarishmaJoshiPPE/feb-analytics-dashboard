<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #141922;
            --bg-card: #1a202e;
            --text-primary: #ffffff;
            --text-secondary: #8b95a8;
            --accent-green: #00d9a5;
            --accent-red: #ff6b6b;
            --accent-blue: #4e9fff;
            --accent-purple: #a78bfa;
            --border: #2a3344;
            --glow: rgba(0, 217, 165, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 2rem;
            line-height: 1.6;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 3rem;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #6fb7e9;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .section-divider {
            margin: 3rem 0 2rem 0;
            border-top: 2px solid var(--border);
            padding-top: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 1.5rem;
            background: var(--accent-blue);
            border-radius: 2px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: cardAppear 0.6s ease-out backwards;
        }

        .kpi-card:nth-child(1) { animation-delay: 0.1s; }
        .kpi-card:nth-child(2) { animation-delay: 0.2s; }
        .kpi-card:nth-child(3) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Analytics Dashboard</h1>
            <p>Performance metrics overview</p>
        </div>

        <div class="section-divider"></div>

        <div class="section-title">Key Metrics</div>

        <div class="kpi-grid">
            <div class="kpi-card">Users</div>
            <div class="kpi-card">Sessions</div>
            <div class="kpi-card">Conversions</div>
        </div>

        <canvas id="chart" height="100"></canvas>
    </div>

<script>
const ctx = document.getElementById('chart');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        datasets: [{
            label: 'Traffic',
            data: [120, 190, 300, 250, 220, 310],
            borderColor: '#4e9fff',
            backgroundColor: 'rgba(78,159,255,0.1)',
            tension: 0.3
        }]
    },
    options: {
        plugins: {
            legend: {
                labels: { color: '#ffffff' }
            }
        },
        scales: {
            x: { ticks: { color: '#8b95a8' }},
            y: { ticks: { color: '#8b95a8' }}
        }
    }
});
</script>

</body>
</html>
